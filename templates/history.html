<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePath - Patient History</title>
    <style>
        :root {
            --bg: #eef1f6;
            --card: #ffffff;
            --ink: #1f2430;
            --ink-soft: #5a6273;
            --line: #d9dee8;
            --accent: #4f46e5;
            --presc: #4f46e5;
            --result: #0891b2;
            --appt: #d97706;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }
        .dash-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--line);
            background: var(--bg);
        }
        .dash-header h1 { font-size: 1.35rem; font-weight: 700; }
        .content { max-width: 820px; margin: 0 auto; padding: 32px 24px; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .page-title { font-size: 1.5rem; margin-bottom: 24px; }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 32px;
        }
        .timeline::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--line);
        }
        .event {
            position: relative;
            margin-bottom: 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px 18px;
        }
        .event::before {
            content: "";
            position: absolute;
            left: -32px;
            top: 18px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid var(--bg);
        }
        .event-prescription::before { background: var(--presc); }
        .event-testresult::before  { background: var(--result); }
        .event-appointment::before { background: var(--appt); }

        .event-type {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 6px;
        }
        .type-prescription { background: #ede9fe; color: var(--presc); }
        .type-testresult  { background: #cffafe; color: var(--result); }
        .type-appointment { background: #fef3c7; color: var(--appt); }

        .event-date { float: right; font-size: 0.8rem; color: var(--ink-soft); }
        .event-detail { font-size: 0.95rem; margin-top: 2px; }
        .empty { padding: 40px; text-align: center; color: var(--ink-soft); }
    </style>
</head>
<body>
    <header class="dash-header">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" fill="#2f6df6"/>
            <path d="M12 17.5s-4.2-2.8-4.2-5.6a2.3 2.3 0 0 1 4.2-1.3 2.3 2.3 0 0 1 4.2 1.3c0 2.8-4.2 5.6-4.2 5.6Z" fill="#ffffff"/>
        </svg>
        <h1>CarePath</h1>
    </header>

    <main class="content">
        <a href="/professional" class="back-link">&larr; Back to Dashboard</a>
        <h2 class="page-title">Medical History &mdash; Patient #{{ patient_id }}</h2>

        <div class="timeline">
            {% for event in history %}
            <div class="event event-{{ event.type|lower|replace(' ', '') }}">
                <span class="event-date">{{ event.date }}</span>
                <span class="event-type type-{{ event.type|lower|replace(' ', '') }}">{{ event.type }}</span>
                <div class="event-detail">{{ event.detail }}</div>
            </div>
            {% endfor %}

            {% if not history %}
            <div class="empty">No medical history found for this patient.</div>
            {% endif %}
        </div>
    </main>
</body>
</html>
